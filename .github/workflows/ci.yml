name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint # includes the rule: only src/lib/access/ may import the database
      - run: pnpm typecheck
      - run: pnpm build
  # Deploy is intentionally absent: hosting is decided after the legal gate (design doc, Open Question 5).

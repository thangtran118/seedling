name: seedling-trudo

# Local development only. Production runs on Vercel + Neon (see DEPLOY.md).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seedling
      POSTGRES_PASSWORD: seedling
      POSTGRES_DB: seedling
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - seedling-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seedling"]
      interval: 5s
      retries: 10

volumes:
  seedling-db:
